<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1620; --panel:#10212d; --ink:#eaf3f9; --muted:#96a9b8; --line:#1f3748;

:root[data-theme="dark"]{--bg:#0a1620; --panel:#10212d; --ink:#eaf3f9; --muted:#96a9b8; --line:#1f3748; --sign:#0a79b0; --ok:#3fd08a; --warn:#f0a93b; color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:16px}
header.sign{background:var(--sign);color:var(--signInk);border-radius:14px;padding:20px 20px 18px;display:grid;grid-template-columns:1fr;gap:16px;align-items:center;position:relative;overflow:hidden}
header.sign::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--amber) 0 22px,transparent 22px 34px)}
.kicker{font:600 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--amber)}
h1{font:700 clamp(30px,7vw,48px)/.95 "Barlow Condensed",Arial Narrow,sans-serif;margin:8px 0 10px;letter-spacing:.01em;text-transform:uppercase}
h1 .arrow{display:inline-block;background:var(--amber);color:var(--sign);border-radius:6px;padding:0 8px;margin-right:8px}
.sub{margin:0;opacity:.85;font-size:15px}
.mainqr{background:#fff;border-radius:10px;padding:8px;width:124px;text-align:center}
.mainqr canvas,.mainqr img{width:108px;height:108px;display:block;image-rendering:pixelated}
.mainqr small{display:block;color:#15181d;font:600 11px/1.2 "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;margin-top:6px}
.progress{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px;font-size:14px;color:var(--muted)}
.progress b{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--amber)}
.tools{display:flex;flex-wrap:wrap;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
.tools input{flex:1 1 100%;min-width:0;font:inherit;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.tools button{font:600 15px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:0 14px;cursor:pointer}
h2.region{font:700 22px/1 "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.08em;margin:22px 0 10px;display:flex;align-items:center;gap:10px}
h2.region::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:1fr;gap:6px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.name{font:700 20px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.02em}
.badge{flex:none;font:600 11px/1 "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:5px;border:1px solid currentColor}
.badge.ok{color:var(--ok)} .badge.warn{color:var(--warn)}
.ret{font-weight:600}
.ret::before{content:"P ";display:inline-block;background:var(--sign);color:#fff;font:700 13px/1 "Barlow Condensed",sans-serif;padding:3px 6px;border-radius:4px;margin-right:6px}
.how{color:var(--muted);font-size:14.5px;margin:0}
.coord{font:400 13px/1.3 "IBM Plex Mono",ui-monospace,monospace;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.actions a,.actions button{font:600 14px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border-radius:8px;padding:9px 12px;border:1px solid var(--line);color:var(--ink);background:transparent;cursor:pointer}
.actions a.waze{background:#33ccff;border-color:#33ccff;color:#0b1a24}
.actions a.primary{background:var(--sign);border-color:var(--sign);color:#fff}
.empty{color:var(--muted);text-align:center;padding:24px}
dialog{border:none;border-radius:14px;padding:20px;max-width:320px;width:calc(100% - 32px);text-align:center;background:#fff;color:#15181d}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog img{width:240px;height:240px;max-width:100%;image-rendering:pixelated}
dialog h3{font:700 20px "Barlow Condensed",sans-serif;margin:0 0 8px}
dialog button{margin-top:10px;font:600 15px "Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.06em;padding:9px 18px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer}
.langs{display:flex;gap:6px;justify-content:flex-end;margin-top:12px}
.langs button{font:600 14px "Barlow Condensed",sans-serif;letter-spacing:.08em;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--sign);border-color:var(--sign);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips a{flex:none;font:600 14px "Barlow Condensed",sans-serif;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px}
.type{font:600 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.hrs{font-size:14.5px}
.hrs b{font-weight:600}
.dot{display:inline-block;font:600 12px/1 "Barlow Condensed",sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:5px;color:#fff;margin-right:4px}
.dot.on{background:var(--ok)} .dot.off{background:#8a8f98}
.kb{display:inline-block;font:600 13px/1 "Barlow Condensed",sans-serif;letter-spacing:.05em;padding:5px 8px;border-radius:6px}
.kb1{background:var(--amber);color:#15181d} .kb2{background:var(--line);color:var(--ink)}
.tools button{white-space:nowrap;flex:1;min-height:42px}
@media(min-width:640px){.tools input{flex-basis:0}.tools button{flex:0 0 auto}}
footer{color:var(--muted);font-size:13px;margin:24px 0 8px}
@media (max-width:520px){header.sign{grid-template-columns:1fr}.mainqr{justify-self:start}}
@media print{.tools,.actions,footer{display:none}.card{break-inside:avoid}}
.fcolink{display:block;text-decoration:none;font:600 16px/1.2 "Barlow Condensed",sans-serif;letter-spacing:.04em;text-transform:uppercase;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:12px}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sign:#0a6fae}}

/* brand rails: vertical side banners on wide screens, logo strip on phones */
.brands{max-width:880px;margin:16px auto 0;padding-inline:16px}
.brandcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px}

@media (min-width:1080px){

  .seg{display:flex;flex:1;align-items:center;justify-content:center;padding:18px}
  .seg-e{background:#169B62}.seg-n{background:#00843D}.seg-a{background:#2A5DAA}
  .rail-r img{width:100%;max-width:none;height:auto;background:#fff;border-radius:12px;padding:14px 12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
}

 it:{title:"Punti di riconsegna",kick:"Tutta Italia",sedi:"sedi",sub:"Dove riconsegnare l'auto, città per città, con navigazione Google Maps, Apple Maps e Waze.",loaded:"uffici Locauto in",prog:"città — elenco completo, come su locautorent.com",jump:"Scegli la città",onlyok:"Solo verificati",onlykb:"🔑 Key box",kb1:"🔑 Key box fuori orario",kb2:"🌙 Riconsegna fuori orario: chiavi al personale del garage",search:"Cerca città o sede…",ok:"Verificato",warn:"Da verificare",nav:"Naviga",call:"Chiama l'ufficio",empty:"Nessuna sede trovata.",types:{1:"✈ Aeroporto",2:"🚆 Stazione",3:"Città"},hours:"Orari ufficio",open:"Aperto ora",closed:"Chiuso ora",closedDays:{sat:"Sab-Dom chiuso",sun:"Dom chiuso"},upd:"Dati aggiornati al",

 en:{title:"Car return points",kick:"All of Italy",sedi:"offices",sub:"Where to return your car, city by city, with Google Maps, Apple Maps and Waze directions.",loaded:"Locauto offices in",prog:"cities — complete list, as on locautorent.com",jump:"Pick a city",onlyok:"Verified only",onlykb:"🔑 Key box",kb1:"🔑 After-hours key box",kb2:"🌙 After-hours return: keys to the garage staff",search:"Search city or location…",ok:"Verified",warn:"To be confirmed",nav:"Directions",call:"Call the office",empty:"No location found.",types:{1:"✈ Airport",2:"🚆 Train station",3:"City"},hours:"Office hours",open:"Open now",closed:"Closed now",closedDays:{sat:"Sat-Sun closed",sun:"Sun closed"},upd:"Data updated on",
     foot:"Source: official location pages on locautorent.com and Google Maps. \"Verified\" = return instructions taken from the official page; \"To be confirmed\" = office location, specific return instructions not yet checked: call the office before returning."}
};
const cityOrder = d => d.c; // alfabetico per città
const wazeUrl = d => d.q ? "https://waze.com/ul?q=" + encodeURIComponent(d.q) + "&navigate=yes" : "https://waze.com/ul?ll=" + d.lat + "," + d.lng + "&navigate=yes";
const navUrl  = d => "https://www.google.com/maps/dir/?api=1&destination=" + (d.q ? encodeURIComponent(d.q) : d.lat + "," + d.lng);
const appleUrl = d => "https://maps.apple.com/?daddr=" + (d.q ? encodeURIComponent(d.q) : d.lat + "," + d.lng) + "&dirflg=d";
const telUrl  = t => "tel:" + t.replace(/[^+0-9]/g, "");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,"-");


const DAYS = {Lun:1,Mar:2,Mer:3,Gio:4,Ven:5,Sab:6,Dom:7};
const DAY_EN = {Lun:"Mon",Mar:"Tue",Mer:"Wed",Gio:"Thu",Ven:"Fri",Sab:"Sat",Dom:"Sun"};
function parseHours(h){ // -> [{from,to,slots:[[m1,m2],...]}]
  return h.split(" · ").map(seg => { const [d, t] = seg.split(" "); const [a,b] = d.split("-");
    return {from:DAYS[a], to:DAYS[b||a], slots:t.split("/").map(x => x.split("-").map(v => { const [hh,mm]=v.split(":"); return (+hh)*60+(+mm); }))}; });
}
function hoursText(h){
  let out = h; const L = T[lang];
  if (lang==="en") out = out.replace(/Lun|Mar|Mer|Gio|Ven|Sab|Dom/g, m => DAY_EN[m]);
  if (!/Sab|Dom/.test(h)) out += " · " + L.closedDays.sat;
  else if (!/Dom/.test(h)) out += " · " + L.closedDays.sun;
  return out;
}
function isOpen(h){
  const parts = Object.fromEntries(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Rome",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date()).map(p=>[p.type,p.value]));
  const wd = {Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6,Sun:7}[parts.weekday]; const now = (+parts.hour%24)*60 + (+parts.minute);
  return parseHours(h).some(r => wd>=r.from && wd<=r.to && r.slots.some(([a,b]) => now>=a && now<=b));
}
let lang = (navigator.language||"it").slice(0,2)==="it" ? "it" : "en";
try{ const s = localStorage.getItem("lang"); if(s) lang = s; }catch(e){}
let onlyOk = false, onlyKb = false;
const cityName = d => lang==="en" ? d.en : d.c;

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T[lang][el.dataset.t]);
  document.getElementById("q").placeholder = T[lang].search;
  document.querySelector("footer").textContent = T[lang].foot + " " + T[lang].upd + " " + UPDATED + ".";
  document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang===lang));
  render();
}
const norm = s => String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
// ranking: city / office name first, address text only on whole-word starts
function score(d, q){
  let s = 0;
  const words = q.split(" ");
  for (const [f, wgt] of [[d.n,1],[d.ne,1],[d.c,.95],[d.en,.9]]) {
    const t = norm(f); let v = 0;
    if (t === q) v = 100;
    else if (t.startsWith(q)) v = 85;
    else if ((" " + t).includes(" " + q)) v = 70;
    else if (words.every(w => (" " + t).includes(" " + w))) v = 55;
    else if (q.length >= 4 && t.includes(q)) v = 45;
    s = Math.max(s, v * wgt);
  }
  if (!s) {
    const t = " " + norm([d.ret, d.rete, d.how, d.howe].join(" "));
    if (words.every(w => w.length >= 3 && t.includes(" " + w))) s = 10;
  }
  return s;
}
function render(){
  const L = T[lang], q = document.getElementById("q").value.trim().toLowerCase();
  const qn = norm(q);
  let rows = DATA.filter(d => (!onlyOk || d.ok) && (!onlyKb || d.kb===1));
  const SC = new Map();
  if (qn) {
    rows.forEach(d => SC.set(d, score(d, qn)));
    rows = rows.filter(d => SC.get(d) > 0);
    if (rows.some(d => SC.get(d) >= 40)) rows = rows.filter(d => SC.get(d) >= 40); // name matches hide address-only matches
  }
  const byC = {};
  rows.forEach(d => (byC[cityName(d)] = byC[cityName(d)] || []).push(d));
  const best = c => Math.max(...byC[c].map(d => SC.get(d) || 0));
  const cities = Object.keys(byC).sort((a,b)=> (best(b)-best(a)) || a.localeCompare(b));
  document.getElementById("chips").innerHTML = cities.map(c => '<a href="#c-'+slug(c)+'">'+esc(c)+'</a>').join("");
  document.getElementById("list").innerHTML = cities.map(c =>
    '<h2 class="region" id="c-'+slug(c)+'"><span>'+esc(c)+'</span><span class="cnt">'+byC[c].length+'</span></h2>' + byC[c].sort((a,b)=>((SC.get(b)||0)-(SC.get(a)||0)) || a.t-b.t || a.n.localeCompare(b.n)).map(d =>
      '<article class="card t'+d.t+'"><div class="top"><div><div class="type">'+L.types[d.t]+'</div><div class="name">'+esc(lang==="en"?d.ne:d.n)+'</div></div>'+
      (d.ok ? '<span class="badge ok">'+L.ok+'</span>' : '<span class="badge warn">'+L.warn+'</span>')+'</div>'+
      '<div class="ret">'+esc(lang==="en"?d.rete:d.ret)+'</div>'+
      (d.kb ? '<div><span class="kb kb'+d.kb+'">'+(d.kb===1?L.kb1:L.kb2)+'</span></div>' : '')+
      (HOURS[d.c+"|"+d.n] ? '<div class="hrs"><span class="dot '+(isOpen(HOURS[d.c+"|"+d.n])?'on':'off')+'">'+(isOpen(HOURS[d.c+"|"+d.n])?L.open:L.closed)+'</span> <b>'+L.hours+':</b> '+esc(hoursText(HOURS[d.c+"|"+d.n]))+'</div>' : '')+
      (d.how ? '<p class="how">'+esc(lang==="en"?d.howe:d.how)+'</p>' : '')+
      '<div class="actions"><a class="primary gm" href="'+navUrl(d)+'" target="_blank" rel="noopener"><img src="/logos/google-maps.svg" alt="" width="12" height="17">Google Maps</a>'+
      '<a class="waze" href="'+wazeUrl(d)+'" target="_blank" rel="noopener">Waze</a>'+
      '<a class="apple gm" href="'+appleUrl(d)+'" target="_blank" rel="noopener"><img src="/logos/apple-maps.svg" alt="" width="18" height="18">Apple Maps</a>'+
      (d.tel ? '<a class="call" href="'+telUrl(d.tel)+'" aria-label="'+L.call+' '+esc(d.tel)+'">\u260E '+esc(d.tel)+'</a>' : '')+'</div></article>'
    ).join("")
  ).join("") || '<p class="empty">'+L.empty+'</p>';
}
document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => { lang = b.dataset.lang; try{localStorage.setItem("lang",lang);}catch(e){} applyLang(); }));
document.getElementById("q").addEventListener("input", render);
document.getElementById("onlykb").addEventListener("click", e => { onlyKb = !onlyKb; e.currentTarget.setAttribute("aria-pressed", onlyKb); e.currentTarget.style.background = onlyKb ? "var(--amber)" : ""; e.currentTarget.style.color = onlyKb ? "#15181d" : ""; render(); });
document.getElementById("onlyok").addEventListener("click", e => { onlyOk = !onlyOk; e.currentTarget.setAttribute("aria-pressed", onlyOk); e.currentTarget.style.background = onlyOk ? "var(--amber)" : ""; e.currentTarget.style.color = onlyOk ? "#15181d" : ""; render(); });
